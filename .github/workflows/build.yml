name: Windows ARM64 Docker Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-11-arm

    steps:
      - name: Check ARM64
        shell: pwsh
        run: |
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "Runner is not ARM64"
          }

      - name: Clone Moby
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/moby/moby.git moby

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: moby/go.mod
          cache: false

      - name: Build Docker
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@latest

          $env:GOPATH = go env GOPATH
          $env:Path += ";$env:GOPATH\bin"

          cd moby
          ./hack/make.ps1 -Client -Daemon

          New-Item -ItemType Directory -Force -Path ..\docker-bin | Out-Null
          Copy-Item bundles\*.exe ..\docker-bin\

      - name: Add Docker to PATH
        shell: pwsh
        run: |
          (Resolve-Path docker-bin).Path |
            Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Start Docker
        id: dockerd
        background: true
        shell: pwsh
        run: |
          dockerd --exec-opt isolation=process

      - name: Wait for Docker
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(3)

          while ($true) {
            docker version *> $null

            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ((Get-Date) -gt $deadline) {
              throw "Docker did not start"
            }

            Start-Sleep -Seconds 5
          }

          docker version

      - name: Run ARM64 Windows container
        shell: pwsh
        run: |
          docker run --rm `
            mcr.microsoft.com/windows/nanoserver:ltsc2025-arm64 `
            cmd /c "echo Architecture: %PROCESSOR_ARCHITECTURE% && ver"

      - name: Stop Docker
        if: always()
        shell: pwsh
        run: |
          docker version *> $null
          if ($LASTEXITCODE -eq 0) {
            docker info
          }
