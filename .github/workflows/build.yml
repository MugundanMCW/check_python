name: Windows ARM64 Container Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-11-arm

    steps:
      - name: Check ARM64
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "Not an ARM64 runner"
          }

      - name: Install Docker
        shell: pwsh
        run: |
          winget install Docker.DockerCLI --accept-source-agreements --accept-package-agreements

      - name: Check Docker
        shell: pwsh
        run: |
          docker version

      - name: Run ARM64 container
        shell: pwsh
        run: |
          docker run --rm `
            mcr.microsoft.com/windows/nanoserver:ltsc2025-arm64 `
            cmd /c "echo Architecture: %PROCESSOR_ARCHITECTURE% && ver"
