name: Check ARM KVM

on:
  workflow_dispatch:

jobs:
  kvm:
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Check architecture
        run: |
          uname -m
          lscpu

      - name: Install cpu-checker
        run: |
          sudo apt-get update
          sudo apt-get install -y cpu-checker

      - name: Check KVM
        run: |
          echo "=== kvm-ok ==="
          sudo kvm-ok

          echo
          echo "=== /dev/kvm ==="
          ls -l /dev/kvm

          echo
          echo "=== KVM modules ==="
          lsmod | grep kvm || true
