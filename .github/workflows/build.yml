name: Windows ARM64 Container Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-11-vs2026-arm

    steps:
      - name: Check host architecture
        shell: pwsh
        run: |
          Write-Host "Host: $env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            throw "Host is not ARM64"
          }

      - name: Run ARM64 Windows container
        shell: pwsh
        run: |
          docker run --rm `
            mcr.microsoft.com/windows/nanoserver:ltsc2025-arm64 `
            cmd /c "echo Container: %PROCESSOR_ARCHITECTURE% && ver"

      - name: Verify container architecture
        shell: pwsh
        run: |
          $arch = docker run --rm `
            mcr.microsoft.com/windows/nanoserver:ltsc2025-arm64 `
            cmd /c "echo %PROCESSOR_ARCHITECTURE%"

          Write-Host "Container architecture: $arch"

          if ($arch.Trim() -ne "ARM64") {
            throw "Container is not ARM64"
          }
