name: Windows ARM64 CPU Info

on:
  workflow_dispatch:

jobs:
  cpu-info:
    runs-on: windows-11-arm

    steps:
      - name: Print CPU configuration
        shell: pwsh
        run: |
          Write-Host "===== System Information ====="
          Get-ComputerInfo | Select-Object `
            WindowsProductName,
            WindowsVersion,
            OsArchitecture,
            CsSystemType,
            CsNumberOfLogicalProcessors,
            CsNumberOfProcessors

          Write-Host "`n===== CPU Information ====="
          Get-CimInstance Win32_Processor | Select-Object `
            Name,
            Manufacturer,
            Architecture,
            NumberOfCores,
            NumberOfLogicalProcessors,
            MaxClockSpeed

          Write-Host "`n===== Memory ====="
          $memory = Get-CimInstance Win32_ComputerSystem
          Write-Host "Total RAM: $([math]::Round($memory.TotalPhysicalMemory / 1GB, 2)) GB"

          Write-Host "`n===== Environment ====="
          Write-Host "PROCESSOR_ARCHITECTURE: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "PROCESSOR_IDENTIFIER:   $env:PROCESSOR_IDENTIFIER"
          Write-Host "NUMBER_OF_PROCESSORS:   $env:NUMBER_OF_PROCESSORS"
