name: List Python Installations

on:
  workflow_dispatch:

jobs:
  list-python:
    runs-on: windows-11-arm

    steps:
      - name: Show Python installations
        shell: pwsh
        run: |
          Write-Host "=== python.exe locations ==="
          where.exe python

          Write-Host "`n=== py launcher ==="
          where.exe py

          Write-Host "`n=== Python versions ==="
          py -0p

          Write-Host "`n=== Python commands ==="
          Get-Command python -All | Format-Table Name, Source
